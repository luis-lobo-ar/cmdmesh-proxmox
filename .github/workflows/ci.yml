name: Validate integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read qualified core source pin
        id: core
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          value = json.loads(Path('.github/core.json').read_text())
          assert set(value) == {'commit'}
          assert re.fullmatch('[a-f0-9]{40}', value['commit'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('commit=' + value['commit'] + '\n')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: luis-lobo-ar/cmdmesh
          ref: ${{ steps.core.outputs.commit }}
          path: .generated/core
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: luis-lobo-ar/cmdmesh-recipes
          ref: '879c157648bd7eb0de33412edfa002d1cb701e49'
          path: .generated/reference-recipes
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: '1.92.0'
      - name: Build the pinned core for actual protocol qualification
        run: |
          umask 077
          mkdir -p .generated/tmp
          TMPDIR="$PWD/.generated/tmp" cargo build --locked --manifest-path .generated/core/Cargo.toml
      - run: python -m pip install -r requirements-dev.txt
      - run: ansible-galaxy collection install -r ansible/requirements.yml -p .ansible/collections
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.23.0'
          cache: false
      - name: Build pinned standard age tools for real encryption tests
        shell: bash
        run: |
          umask 077
          mkdir -p .generated/age/{bin,cache,modules,tmp}
          export GOBIN="$PWD/.generated/age/bin"
          export GOCACHE="$PWD/.generated/age/cache"
          export GOPATH="$PWD/.generated/age/modules"
          export GOTMPDIR="$PWD/.generated/age/tmp"
          export GOTOOLCHAIN=local
          export GOPROXY=https://proxy.golang.org
          export GOSUMDB=sum.golang.org
          go install filippo.io/age/cmd/age@v1.2.1 filippo.io/age/cmd/age-keygen@v1.2.1
          "$GOBIN/age" --version
      - name: Behavioral API and Ansible tests
        run: python -m unittest discover -s tests -v
        env:
          CMDMESH_BIN: ${{ github.workspace }}/.generated/core/target/debug/cmdmesh
          CMDMESH_AGE: ${{ github.workspace }}/.generated/age/bin/age
          CMDMESH_AGE_KEYGEN: ${{ github.workspace }}/.generated/age/bin/age-keygen
          CMDMESH_REFERENCE_GUARD_SOURCE: ${{ github.workspace }}/.generated/reference-recipes/examples/reference-ledger/prestart_guard.py
      - name: All role syntax checks
        run: python tools/check-ansible.py
      - name: Basic role lint
        env:
          ANSIBLE_COLLECTIONS_PATH: '${{ github.workspace }}/ansible/ansible_collections:${{ github.workspace }}/.ansible/collections'
        run: ansible-lint --offline ansible/ansible_collections/cmdmesh/proxmox
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.14.2'
          terraform_wrapper: false
      - run: terraform fmt -check -recursive terraform
      - run: terraform -chdir=terraform/examples/lxc init -backend=false -input=false
      - run: terraform -chdir=terraform/examples/lxc validate
