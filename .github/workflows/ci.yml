name: Validate integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: ansible-galaxy collection install -r ansible/requirements.yml -p .ansible/collections
      - name: Behavioral API and Ansible tests
        run: python -m unittest discover -s tests -v
      - name: All role syntax checks
        run: python tools/check-ansible.py
      - name: Basic role lint
        env:
          ANSIBLE_COLLECTIONS_PATH: '${{ github.workspace }}/ansible/ansible_collections:${{ github.workspace }}/.ansible/collections'
        run: ansible-lint --offline ansible/ansible_collections/cmdmesh/proxmox
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.14.2'
          terraform_wrapper: false
      - run: terraform fmt -check -recursive terraform
      - run: terraform -chdir=terraform/examples/lxc init -backend=false -input=false
      - run: terraform -chdir=terraform/examples/lxc validate
