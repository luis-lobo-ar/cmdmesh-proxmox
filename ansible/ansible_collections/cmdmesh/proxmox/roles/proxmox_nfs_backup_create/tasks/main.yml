---
- name: Require one target and create-only semantics
  ansible.builtin.assert:
    that:
      - ansible_play_hosts_all | length == 1
      - proxmox_nfs_backup_storage_create_only is sameas true
    fail_msg: New backup storage requires exactly one target and create-only mode.

- name: Register only a new backup storage
  ansible.builtin.import_role:
    name: cmdmesh.proxmox.proxmox_nfs_backup_storage
  vars:
    proxmox_nfs_backup_storage_create_only: true
