---
- name: Validate explicit device keys and values
  ansible.builtin.assert:
    that:
      - item.key is match('^dev[0-9]+$')
      - item.value is string
      - item.value is match('^/dev/[A-Za-z0-9_./,-]+(?:,[A-Za-z0-9_=,-]+)*$')
  loop: "{{ hostvars[proxmox_lxc_devices_guest].proxmox_lxc_device_passthroughs | default([]) }}"

- name: Read selected guest configuration
  ansible.builtin.command:
    argv: [pct, config, "{{ hostvars[proxmox_lxc_devices_guest].proxmox_vmid }}"]
  register: proxmox_lxc_devices_current
  changed_when: false
  check_mode: false

- name: Apply explicitly declared device configuration
  ansible.builtin.command:
    argv: [pct, set, "{{ hostvars[proxmox_lxc_devices_guest].proxmox_vmid }}", "--{{ item.key }}", "{{ item.value }}"]
  changed_when: true
  loop: "{{ hostvars[proxmox_lxc_devices_guest].proxmox_lxc_device_passthroughs | default([]) }}"
  when: >-
    (item.key ~ ': ' ~ item.value) not in proxmox_lxc_devices_current.stdout_lines
