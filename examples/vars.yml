cmdmesh_allow_changes: false
lifecycle_owner: ansible
proxmox_baseline_host_packages: [curl, jq]
proxmox_lxc_resources_guests: [demo]
proxmox_lxc_storage_guests: [demo]
proxmox_vm_backup_schedule_enabled: false
